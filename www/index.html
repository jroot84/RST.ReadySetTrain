<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>RST • Ready Set Train — Workout Routine Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#1F6F54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RST">
<style>
  :root, [data-theme="dark"] {
    --bg950:#14181C; --bg900:#1B2126; --bg800:#232B32; --line:#333D45;
    --ember:#E8622C; --ember-dim:#7A3A21; --ember-tag:#F5B79A; --ember-wash: rgba(232,98,44,0.08);
    --cyan:#2FB8B0; --cyan-dim:#1F5F5B; --cyan-tag:#8FE8E2;
    --chalk:#ECE8E1; --chalk-dim:#8F99A1; --scrollbar:#333D45;
  }
  [data-theme="light"] {
    --bg950:#EEF1F3; --bg900:#FFFFFF; --bg800:#F4F6F7; --line:#D8DEE2;
    --ember:#D9541F; --ember-dim:#FBE1D2; --ember-tag:#A8431A; --ember-wash: rgba(217,84,31,0.08);
    --cyan:#1C948C; --cyan-dim:#D3EFED; --cyan-tag:#136560;
    --chalk:#1B2226; --chalk-dim:#69747C; --scrollbar:#C7CED3;
  }
  /* Accent palettes — override just the accent tokens; base theme (dark/light)
     still controls background/text tokens above. "ember" is the default and
     needs no override block since it matches the base theme values. */
  [data-theme="dark"][data-palette="ocean"]   { --ember:#3B82F6; --ember-dim:#1E3A5F; --ember-tag:#93C5FD; --ember-wash: rgba(59,130,246,0.08); }
  [data-theme="light"][data-palette="ocean"]  { --ember:#2563EB; --ember-dim:#DBEAFE; --ember-tag:#1D4ED8; --ember-wash: rgba(37,99,235,0.08); }
  [data-theme="dark"][data-palette="violet"]  { --ember:#8B5CF6; --ember-dim:#3D2B6B; --ember-tag:#D8CBFB; --ember-wash: rgba(139,92,246,0.08); }
  [data-theme="light"][data-palette="violet"] { --ember:#7C3AED; --ember-dim:#EDE4FE; --ember-tag:#6025C4; --ember-wash: rgba(124,58,237,0.08); }
  [data-theme="dark"][data-palette="forest"]  { --ember:#43A047; --ember-dim:#234C29; --ember-tag:#A8DDAE; --ember-wash: rgba(67,160,71,0.08); }
  [data-theme="light"][data-palette="forest"] { --ember:#2E7D32; --ember-dim:#DCF3DD; --ember-tag:#1B5E20; --ember-wash: rgba(46,125,50,0.08); }
  [data-theme="dark"][data-palette="crimson"]  { --ember:#E0446B; --ember-dim:#6E2434; --ember-tag:#F6B3C4; --ember-wash: rgba(224,68,107,0.08); }
  [data-theme="light"][data-palette="crimson"] { --ember:#C2185B; --ember-dim:#FBDCE6; --ember-tag:#99123F; --ember-wash: rgba(194,24,91,0.08); }
  [data-theme="dark"][data-palette="slate"]   { --ember:#8A93A6; --ember-dim:#3A414C; --ember-tag:#D4D9E0; --ember-wash: rgba(138,147,166,0.08); }
  [data-theme="light"][data-palette="slate"]  { --ember:#52606D; --ember-dim:#E5E8EC; --ember-tag:#37414C; --ember-wash: rgba(82,96,109,0.08); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg950); color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-overflow-scrolling: touch;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; background: none; border: none; color: inherit; }
  a { text-decoration: none; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .wrap { max-width: 48rem; margin: 0 auto; padding: 0 16px; }

  /* header */
  header { position: sticky; top: 0; z-index: 20; background: var(--bg950); border-bottom: 1px solid var(--line); }
  .header-inner { display:flex; align-items:center; justify-content:space-between; padding: 16px 0; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; overflow:hidden; }
  .brand-icon { width:32px; height:32px; border-radius:3px; background: var(--ember); display:flex; align-items:center; justify-content:center; transform: rotate(3deg); flex-shrink:0; }
  .brand-icon svg { color: var(--bg950); }
  h1.title { margin:0; font-size:20px; text-transform:uppercase; letter-spacing:0.05em; line-height:1; color: var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  h1.title span { color: var(--ember); }
  h1.title .tagline { font-family:'JetBrains Mono',monospace; color: var(--chalk-dim); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin-left:2px; }
  .today-date { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color: var(--chalk-dim); flex-shrink:0; }

  main { max-width: 48rem; margin: 0 auto; padding: 20px 16px 160px; }

  /* tabbar */
  nav.tabbar { position: fixed; bottom:0; left:0; right:0; z-index:20; background: var(--bg900); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar-inner { max-width: 48rem; margin:0 auto; display:grid; grid-template-columns: repeat(5, 1fr); }
  .tab-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0; color: var(--chalk-dim); }
  .tab-btn.active { color: var(--ember); }
  .tab-btn span { font-size:9px; text-transform:uppercase; letter-spacing:0.08em; }

  /* generic pieces */
  .section-label { font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color: var(--chalk-dim); margin-bottom:8px; }
  .card { background: var(--bg900); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .day-tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; }
  .day-tag.cardio { background: var(--cyan-dim); color: var(--cyan-tag); }
  .day-tag.strength { background: var(--ember-dim); color: var(--ember-tag); }
  .day-tag.rest { background: var(--bg800); color: var(--chalk-dim); border: 1px solid var(--line); }

  .block-row { border-radius:8px; border:1px solid var(--line); background: var(--bg800); transition: background 0.15s, border-color 0.15s; margin-bottom:10px; }
  .block-row.done { background: var(--ember-wash); border-color: var(--ember); }
  .block-row-main { display:flex; align-items:center; gap:12px; padding:12px 14px; }
  .check-btn { flex-shrink:0; width:28px; height:28px; border-radius:3px; display:flex; align-items:center; justify-content:center; border:2px solid var(--chalk-dim); background:transparent; }
  .check-btn.done { background: var(--ember); border-color: var(--ember); }
  .check-btn.done svg { color: var(--bg950); }
  .block-btn { flex:1; min-width:0; text-align:left; }
  .block-name { font-weight:600; font-size:15px; line-height:1.2; color: var(--chalk); }
  .block-row.done .block-name { color: var(--chalk-dim); text-decoration: line-through; }
  .block-meta { font-family:'JetBrains Mono',monospace; font-size:11px; margin-top:2px; color: var(--chalk-dim); }
  .block-meta .note { color: var(--ember-tag); }
  .info-btn { flex-shrink:0; width:28px; height:28px; border-radius:3px; display:flex; align-items:center; justify-content:center; color: var(--chalk-dim); }
  .info-btn.open { color: var(--ember); }
  .block-detail { padding: 10px 14px 14px; border-top:1px solid var(--line); }
  .block-detail p { margin:0 0 10px; font-size:13px; line-height:1.5; color: var(--chalk-dim); }
  .yt-link { display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color: var(--ember); }

  .banner { border-radius:8px; padding:12px 16px; display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:14px; background: var(--ember-wash); border:1px solid var(--ember); color: var(--ember); margin-bottom:16px; }

  /* calendar */
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-nav-btn { padding:6px; color: var(--chalk-dim); }
  .cal-month { font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:16px; color: var(--chalk); }
  .cal-dow-row, .cal-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
  .cal-dow-row div { text-align:center; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.08em; color: var(--chalk-dim); }
  .cal-day { aspect-ratio: 1/1; border-radius:3px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--chalk); border:1px solid transparent; background:transparent; }
  .cal-day.today { border-color: var(--line); }
  .cal-day.selected { background: var(--ember-wash); border-color: var(--ember); }
  .cal-dot { width:6px; height:6px; border-radius:50%; margin-top:3px; }
  .cal-dot.outline { background:transparent !important; border:1.5px solid; box-sizing:border-box; }
  .cal-dot.rest-mark { width:8px; height:2px; border-radius:1px; margin-top:6px; }

  /* day tabs (builder) */
  .day-tabs { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
  .day-tab-btn { padding:8px 0; border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.06em; background: var(--bg800); color: var(--chalk-dim); border:1px solid var(--line); }
  .day-tab-btn.active.strength { background: var(--ember-dim); color: var(--chalk); border-color: var(--ember); }
  .day-tab-btn.active.cardio { background: var(--cyan-dim); color: var(--chalk); border-color: var(--cyan); }

  .day-label-input { font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:18px; background:transparent; border:none; outline:none; color: var(--chalk); flex:1; min-width:0; }
  .type-toggle { display:flex; border-radius:3px; overflow:hidden; border:1px solid var(--line); flex-shrink:0; }
  .type-toggle button { padding:7px 10px; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; display:flex; align-items:center; gap:4px; color: var(--chalk-dim); }
  .type-toggle button.active.strength { background: var(--ember-dim); color: var(--chalk); }
  .type-toggle button.active.cardio { background: var(--cyan-dim); color: var(--chalk); }
  .type-toggle button.active.rest { background: var(--bg800); color: var(--chalk); }

  .builder-block { border-radius:8px; padding:12px; background: var(--bg800); border:1px solid var(--line); margin-bottom:10px; }
  .builder-block-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .builder-block-head .name { font-weight:600; font-size:14px; color: var(--chalk); }
  .builder-block-head button { color: var(--chalk-dim); }
  .field-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--chalk-dim); margin-bottom:8px; }
  .num-input, .min-input { width:56px; font-family:'JetBrains Mono',monospace; font-size:13px; border-radius:3px; padding:5px 6px; outline:none; background: var(--bg900); color: var(--chalk); border:1px solid var(--line); }
  .note-input { width:100%; font-size:12px; border-radius:3px; padding:6px 8px; outline:none; background: var(--bg900); color: var(--chalk); border:1px solid var(--line); }
  .dashed-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 0; border-radius:8px; border:1px dashed var(--line); color: var(--chalk-dim); font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; }

  /* modal */
  .modal-overlay { position:fixed; inset:0; z-index:30; background:rgba(10,12,14,0.7); display:flex; align-items:flex-end; justify-content:center; }
  .modal { width:100%; max-width:28rem; max-height:75vh; display:flex; flex-direction:column; background: var(--bg900); border:1px solid var(--line); border-radius:12px 12px 0 0; }
  @media (min-width:640px){ .modal-overlay{ align-items:center; } .modal{ border-radius:12px; } }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px; }
  .modal-head span { font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:16px; color: var(--chalk); }
  .modal-head button { color: var(--chalk-dim); }
  .search-box { display:flex; align-items:center; gap:8px; border-radius:3px; padding:7px 10px; background: var(--bg800); border:1px solid var(--line); margin: 0 16px 8px; }
  .search-box input { background:transparent; border:none; outline:none; flex:1; font-size:14px; color: var(--chalk); }
  .modal-list { overflow-y:auto; padding: 0 16px 16px; }
  .picker-row { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:8px; background: var(--bg800); border:1px solid var(--line); text-align:left; margin-bottom:6px; }
  .picker-row .pname { font-weight:500; font-size:14px; color: var(--chalk); }
  .picker-row .pmeta { font-family:'JetBrains Mono',monospace; font-size:10px; color: var(--chalk-dim); margin-top:2px; }

  /* library */
  .pill-row { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
  .pill { flex-shrink:0; padding:6px 12px; border-radius:999px; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; background: var(--bg800); color: var(--chalk-dim); border:1px solid var(--line); }
  .pill.active { background: var(--ember-dim); color: var(--chalk); border-color: var(--ember); }
  .pill-removable { display:inline-flex; align-items:center; gap:6px; }
  .pill-removable button { display:flex; color: inherit; opacity:0.7; }
  .pill-removable button:hover { opacity:1; }
  .swatch-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .swatch-btn { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .swatch-dot { width:30px; height:30px; border-radius:50%; border:2px solid transparent; }
  .swatch-btn.active .swatch-dot { border-color: var(--chalk); }
  .swatch-label { font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color: var(--chalk-dim); }
  .swatch-btn.active .swatch-label { color: var(--chalk); }
  .lib-row { border-radius:8px; background: var(--bg900); border:1px solid var(--line); margin-bottom:8px; }
  .lib-row-head { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; text-align:left; }
  .lib-row-head .lname { font-weight:600; font-size:15px; color: var(--chalk); }
  .lib-row-head .lmeta { font-family:'JetBrains Mono',monospace; font-size:11px; margin-top:2px; color: var(--chalk-dim); }
  .lib-row-icons { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .lib-detail { padding:10px 14px 14px; border-top:1px solid var(--line); }
  .lib-detail p { margin:0 0 10px; font-size:13px; line-height:1.5; color: var(--chalk-dim); }

  .empty-note { font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--chalk-dim); font-style:italic; padding: 4px 0; }
  .text-input, .select-input, textarea.text-input { width:100%; font-size:14px; border-radius:3px; padding:9px 10px; outline:none; background: var(--bg800); color: var(--chalk); border:1px solid var(--line); }
  textarea.text-input { resize:none; font-family:'Inter',sans-serif; }
  .form-row-2 { display:flex; gap:8px; }
  .btn-primary { flex:1; padding:9px 0; border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; background: var(--ember); color: var(--bg950); text-align:center; }
  .btn-outline { flex:1; padding:9px 0; border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; border:1px solid var(--line); color: var(--chalk-dim); text-align:center; }
  .foot-note { display:flex; align-items:flex-start; gap:8px; padding: 4px 4px; }
  .foot-note svg { flex-shrink:0; margin-top:2px; color: var(--chalk-dim); }
  .foot-note p { margin:0; font-family:'JetBrains Mono',monospace; font-size:10px; line-height:1.5; color: var(--chalk-dim); }

  /* settings */
  .settings-block { margin-bottom:20px; }
  .settings-toggle { display:flex; border-radius:3px; overflow:hidden; border:1px solid var(--line); flex-shrink:0; }
  .settings-toggle button { padding:8px 12px; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; display:flex; align-items:center; gap:6px; color: var(--chalk-dim); }
  .settings-toggle button.active { background: var(--ember-dim); color: var(--chalk); }
  .settings-item-row { display:flex; align-items:center; justify-content:space-between; }
  .settings-item-row + .settings-item-row { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .settings-title { font-weight:600; font-size:14px; color: var(--chalk); }
  .settings-desc { font-family:'JetBrains Mono',monospace; font-size:10px; margin-top:2px; line-height:1.5; color: var(--chalk-dim); max-width: 220px; }
  .action-btn { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; border:1px solid var(--ember); color: var(--ember); }
  .about-row { display:flex; align-items:center; gap:10px; }
  .settings-search { display:flex; align-items:center; gap:10px; background:var(--bg900); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:18px; }
  .settings-search input { flex:1; min-width:0; background:transparent; border:none; outline:none; color:var(--chalk); font-family:'JetBrains Mono',monospace; font-size:13px; }
  .settings-search input::placeholder { color:var(--chalk-dim); }
  .settings-menu-list { display:flex; flex-direction:column; }
  .settings-menu-row { display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:12px 4px; color:inherit; border-radius:10px; }
  .settings-menu-row:active { background:var(--bg800); }
  .settings-menu-icon { flex-shrink:0; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; }
  .settings-menu-label { font-weight:600; font-size:15px; color: var(--chalk); }
  .settings-menu-desc { font-family:'JetBrains Mono',monospace; font-size:10px; margin-top:2px; line-height:1.4; color: var(--chalk-dim); }
  .settings-menu-chevron { flex-shrink:0; color: var(--chalk-dim); display:flex; }
  .settings-menu-empty { text-align:center; padding:32px 14px; color:var(--chalk-dim); font-family:'JetBrains Mono',monospace; font-size:12px; }
  .settings-section-head { display:flex; align-items:center; margin-bottom:14px; }
  .settings-back-btn { display:flex; align-items:center; gap:2px; color: var(--chalk-dim); font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; padding:4px 4px 4px 0; }

  @keyframes stampIn { 0% { transform: scale(1.6) rotate(-8deg); opacity: 0; } 60% { transform: scale(0.92) rotate(-8deg); opacity: 1; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
  .stamp-anim { animation: stampIn 0.28s ease-out; }

  .onboarding-screen { max-width: 26rem; padding: 48px 16px; }
</style>
</head>

<div id="app"></div>

<script>
/* ------------------------------------------------------------------ */
/* Icons (minimal inline SVG, 24x24, stroke-based)                     */
/* ------------------------------------------------------------------ */
const ICON = {
  check: '<path d="M4 12l5 5L20 6"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash: '<path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-8 0v12a1 1 0 001 1h6a1 1 0 001-1V7"/>',
  chevronDown: '<path d="M6 9l6 6 6-6"/>',
  chevronLeft: '<path d="M15 18l-6-6 6-6"/>',
  chevronRight: '<path d="M9 18l6-6-6-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/>',

function dateKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return dateKey(new Date()); }
function isEditableDate(d){ return dateKey(d) === todayKey(); }
function isPastDate(d){ return dateKey(d) < todayKey(); }

/* ------------------------------------------------------------------ */
/* Anti-cheat: clock-tamper detection                                   */
/* A day can only ever be completed while it IS that day (see           */
/* isEditableDate + the toggle-done / session guards below). The one    */
/* way around that from inside the app is winding the device clock      */
/* back, so we keep a high-water mark of the last time the app was seen */
/* running and flag it if "now" ever jumps backward more than a small   */
/* tolerance (allows for normal timezone/DST shifts while still         */
/* catching someone rolling the clock back a day or more to backdate a  */
/* workout).                                                            */
/* ------------------------------------------------------------------ */
const CLOCK_KEY = "rst-last-seen-ts";
const CLOCK_TOLERANCE_MS = 3 * 60 * 60 * 1000; // 3 hours
function checkClockIntegrity() {
  const now = Date.now();
  let last = 0;
  try { last = parseInt(localStorage.getItem(CLOCK_KEY) || "0", 10) || 0; } catch (e) {}
  if (last && now < last - CLOCK_TOLERANCE_MS) {
    state.clockWarning = true;
    return;
  }
  state.clockWarning = false;
  if (!last || now > last) {
    try { localStorage.setItem(CLOCK_KEY, String(now)); } catch (e) {}
  }
}
function fmtDuration(sec){ if(!sec) return ""; if (sec % 60 === 0) return (sec/60)+" min"; return sec+" sec"; }
function fmtClock(sec){ sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60); const s = sec%60; return m+":"+String(s).padStart(2,"0"); }
function youtubeSearchUrl(name){ return "https://www.youtube.com/results?search_query="+encodeURIComponent("how to "+name+" exercise proper form"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const STORAGE_KEY = "rst:v1";
const LEGACY_STORAGE_KEY = "ironlog:v1"; // migrate any data saved under the app's old name
function loadData() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (legacy) {
        raw = legacy;
        localStorage.setItem(STORAGE_KEY, legacy);
        localStorage.removeItem(LEGACY_STORAGE_KEY);
      }
    }
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return null;
}
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      routine: state.routine, library: state.library, equipment: state.equipment,
      progress: state.progress, theme: state.theme, palette: state.palette,
      profile: state.profile, onboardingDone: state.onboardingDone, bestStreak: state.bestStreak,
      sessionRotate: state.sessionRotate,
    }));
  } catch (e) { console.error("Failed to save", e); }
}

/* ------------------------------------------------------------------ */
/* Backup export / import                                               */
/* ------------------------------------------------------------------ */
async function exportBackup() {
  const payload = {
    app: "RST", version: 1, exportedAt: new Date().toISOString(),
    routine: state.routine, library: state.library, equipment: state.equipment, progress: state.progress,
    theme: state.theme, palette: state.palette, profile: state.profile, onboardingDone: state.onboardingDone,
    bestStreak: state.bestStreak, sessionRotate: state.sessionRotate,
  };
  const stamp = new Date().toISOString().slice(0, 10);
  const baseName = "rst-backup-" + stamp;
  const json = JSON.stringify(payload, null, 2);
  const shareTitle = "RST Backup";
  const shareText = "RST backup — " + stamp;

  // Prefer the native share sheet — it's the only way a web app can hand a
  // file straight to another app (OneDrive, Google Drive, Files, etc.)
  // instead of just dropping it in the browser's Downloads folder. This
  // requires a secure context (https, or localhost) — navigator.share
  // won't exist at all otherwise, and we'll silently fall through to a
  // plain download below.
  //
  // Only text/plain + a .txt extension is attempted (not application/json):
  // navigator.share() spends the click's one-shot "user activation" the
  // moment it's called, whether it succeeds or throws, so trying a second
  // MIME type after a failed first attempt never actually gets a fair shot.
  // text/plain + .txt is the pairing browsers' share safelists accept, so
  // it's the one worth using.
  if (typeof navigator.share === "function") {
    const file = new File([json], baseName + ".txt", { type: "text/plain" });
    const canShareOk = navigator.canShare ? navigator.canShare({ files: [file] }) : true;
    if (canShareOk) {
      try {
        await navigator.share({ files: [file], title: shareTitle, text: shareText });
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return; // user backed out of the share sheet
        // fall through to download
      }
    }
  }

  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = baseName + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function looksLikeBackup(data) {
  return !!(data && typeof data === "object" &&
    ("routine" in data || "library" in data || "progress" in data || "profile" in data));
}

function handleImportFile(file) {
  state.importError = "";
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!looksLikeBackup(parsed)) {
        state.importError = "That file doesn't look like an RST backup.";
        state.pendingImport = null;
      } else {
        state.pendingImport = { fileName: file.name, data: parsed };
      }
    } catch (e) {
      state.importError = "Couldn't read that file — make sure it's an RST backup (.json or .txt).";
      state.pendingImport = null;
    }
    render();
  };
  reader.onerror = () => {
    state.importError = "Couldn't read that file.";
    render();
  };
  reader.readAsText(file);
}

function migrateProfile(p) {
  if (!p) return p;
  if (!Array.isArray(p.goals)) {
    p.goals = (p.goal && typeof p.goal === "string") ? [p.goal] : [];
  }
  delete p.goal;
  if (!("availableEquipment" in p)) p.availableEquipment = null;
  return p;
}

function applyPendingImport() {
  const data = state.pendingImport && state.pendingImport.data;
  if (!data) return;
  if (data.routine) state.routine = data.routine;
  if (data.library) state.library = data.library;
  if (data.equipment) state.equipment = data.equipment;
  if (data.progress) state.progress = data.progress;
  if (data.theme) state.theme = data.theme;
  if (data.palette) state.palette = data.palette;
  if (data.profile) state.profile = migrateProfile(data.profile);
  if (typeof data.onboardingDone === "boolean") state.onboardingDone = data.onboardingDone;
  if (typeof data.bestStreak === "number") state.bestStreak = data.bestStreak;
  if (typeof data.sessionRotate === "boolean") state.sessionRotate = data.sessionRotate;
  state.pendingImport = null;
  state.importError = "";
  saveData();
  render();
}

/* ------------------------------------------------------------------ */
/* Back-button / history navigation                                     */
/* ------------------------------------------------------------------ */
// We push a history entry for each top-level tab switch and each modal
// open, so the device/browser back button steps back through them just
// like a native app. Explicit "close" UI (X button, backdrop tap) routes
// through history.back() too, so the stack never gets out of sync.
let applyingPopState = false;

function historySnapshot() {
  return { tab: state.tab, pickerOpen: state.pickerOpen, showCheckModal: state.showCheckModal, showManageEquipment: state.showManageEquipment, showSuggestedModal: state.showSuggestedModal, showAddExercise: state.showAddExercise, showEditExercise: state.showEditExercise, sessionActive: state.sessionActive, showBadgeModal: state.showBadgeModal, settingsSection: state.settingsSection };
}
function pushHistory() {
  if (applyingPopState) return;
  try {
    history.pushState(historySnapshot(), "");
  } catch (e) {
    // History API can be restricted in some embedded/sandboxed contexts —
    // fail silently; back-button support just won't be available there.
  }
}
function replaceHistory() {
  try {
    history.replaceState(historySnapshot(), "");
  } catch (e) {
    /* see note above */
  }
}
function closeModalViaBack() {
  // If the current history entry represents the open modal, let the
  // browser's own back navigation close it (keeps stack consistent).
  if (history.state && (history.state.pickerOpen || history.state.showCheckModal || history.state.showManageEquipment || history.state.showSuggestedModal || history.state.showAddExercise || history.state.showEditExercise || history.state.sessionActive || history.state.showBadgeModal || history.state.settingsSection)) {
    history.back();
  } else {
    state.pickerOpen = false;
    state.showCheckModal = false;
    state.showManageEquipment = false;
    state.showSuggestedModal = false;
    state.showAddExercise = false;
    state.showEditExercise = false;
    state.sessionActive = false;
    state.showBadgeModal = false;
    state.settingsSection = null;
    render();
  }
}
window.addEventListener("popstate", (e) => {
  if (!state.onboardingDone) return; // nothing to navigate before setup is done
  applyingPopState = true;
  const snap = e.state || { tab: "today", pickerOpen: false, showCheckModal: false, showManageEquipment: false, showSuggestedModal: false, showAddExercise: false, showEditExercise: false, sessionActive: false, showBadgeModal: false, settingsSection: null };
  state.tab = snap.tab;
  state.pickerOpen = !!snap.pickerOpen;
  state.showCheckModal = !!snap.showCheckModal;
  state.showManageEquipment = !!snap.showManageEquipment;
  state.showSuggestedModal = !!snap.showSuggestedModal;
  state.showAddExercise = !!snap.showAddExercise;
  state.showEditExercise = !!snap.showEditExercise;
  state.sessionActive = !!snap.sessionActive;
  state.showBadgeModal = !!snap.showBadgeModal;
  state.settingsSection = snap.settingsSection || null;
  stopSessionTimer();
  render();
  applyingPopState = false;
});

/* ------------------------------------------------------------------ */
/* Streaks, ranks, and badges                                           */
/* ------------------------------------------------------------------ */
// A day "counts" toward a streak only if it had exercises scheduled and
// every one of them was checked off. Rest days (nothing scheduled) are
// skipped over — they neither build nor break a streak. This uses the
// *current* routine as a stand-in for what was scheduled on past dates,
// same simplification the calendar view already relies on.
function computeCurrentStreak() {
  const todayKey = dateKey(new Date());
  let current = 0;
  const cursor = new Date();
  for (let i = 0; i < 3650; i++) {
    const key = dateKey(cursor);
    const dow = cursor.getDay();
    const day = state.routine[dow];
    const scheduled = day && day.blocks.length > 0;
    if (!scheduled) { cursor.setDate(cursor.getDate() - 1); continue; }
    const prog = state.progress[key];
    const doneCount = prog && prog.doneBlockIds ? prog.doneBlockIds.length : 0;
    const isComplete = doneCount >= day.blocks.length;
    if (key === todayKey && !isComplete) { cursor.setDate(cursor.getDate() - 1); continue; }
    if (isComplete) { current++; cursor.setDate(cursor.getDate() - 1); }
    else break;
  }
  return current;
}
function totalExercisesCompleted() {
  return Object.values(state.progress).reduce((sum, p) => sum + ((p && p.doneBlockIds) ? p.doneBlockIds.length : 0), 0);
}
// Recomputes the current streak and keeps the persisted best-streak in
// sync. Cheap enough to call after any action that could change it.
function refreshStreaks() {
  const current = computeCurrentStreak();
  if (current > state.bestStreak) state.bestStreak = current;
  return current;
}

const RANK_TIERS = [
  { id:"rookie", label:"Rookie", min:0 },
  { id:"committed", label:"Committed", min:25 },
  { id:"dedicated", label:"Dedicated", min:100 },
  { id:"elite", label:"Elite", min:250 },
  { id:"legend", label:"Legend", min:500 },
];
function getRank(total) {
  let rank = RANK_TIERS[0];
  for (const r of RANK_TIERS) { if (total >= r.min) rank = r; }
  const idx = RANK_TIERS.indexOf(rank);
  const next = RANK_TIERS[idx + 1] || null;
  return { ...rank, next, toNext: next ? next.min - total : 0 };
}

const BADGES = [
  { id:"first-workout", label:"First Workout", desc:"Complete your first exercise", earned: s => s.total >= 1 },
  { id:"streak-3", label:"3-Day Streak", desc:"Complete 3 days in a row", earned: s => s.bestStreak >= 3 },
  { id:"streak-7", label:"7-Day Streak", desc:"Complete 7 days in a row", earned: s => s.bestStreak >= 7 },
  { id:"streak-30", label:"30-Day Streak", desc:"Complete 30 days in a row", earned: s => s.bestStreak >= 30 },
  { id:"streak-100", label:"100-Day Streak", desc:"Complete 100 days in a row", earned: s => s.bestStreak >= 100 },
  { id:"total-25", label:"25 Exercises", desc:"Complete 25 exercises total", earned: s => s.total >= 25 },
  { id:"total-100", label:"100 Exercises", desc:"Complete 100 exercises total", earned: s => s.total >= 100 },
  { id:"total-250", label:"250 Exercises", desc:"Complete 250 exercises total", earned: s => s.total >= 250 },
  { id:"total-500", label:"500 Exercises", desc:"Complete 500 exercises total", earned: s => s.total >= 500 },
];
function getStreakStats() {
  const current = refreshStreaks();
  const total = totalExercisesCompleted();
  const rank = getRank(total);
  const earned = BADGES.filter(b => b.earned({ current, bestStreak: state.bestStreak, total }));
  return { current, best: state.bestStreak, total, rank, earned, allBadges: BADGES };
}

function hasProfileBasics() {
  const p = state.profile;
  return p && p.heightFt && p.weightLbs;
}

/* ------------------------------------------------------------------ */
/* Fitness check algorithm                                              */
/* ------------------------------------------------------------------ */
function bmiCategory(bmi) {
  if (bmi < 18.5) return "Underweight";
  if (bmi < 25) return "Normal range";
  if (bmi < 30) return "Overweight";
  return "Obesity range";
}

function computeCheck() {
  if (!hasProfileBasics()) return null;
  const p = state.profile;
  const heightIn = (Number(p.heightFt) || 0) * 12 + (Number(p.heightIn) || 0);
  const weight = Number(p.weightLbs) || 0;
  const bmi = heightIn > 0 ? (703 * weight) / (heightIn * heightIn) : null;
  const age = Number(p.age) || null;
  const goals = (p.goals && p.goals.length) ? p.goals : ["general-fitness"];

  let strengthDays = 0, cardioDays = 0, totalSets = 0, totalCardioMin = 0;
  const dayTypes = [];
  const dayHasIntense = [];
  const intensityCounts = { light:0, moderate:0, intense:0 };
  let strengthIntensitySum = 0, strengthIntensityBlocks = 0;
  for (let i = 0; i < 7; i++) {
    const d = state.routine[i];
    if (!d || d.blocks.length === 0) { dayTypes.push("rest"); dayHasIntense.push(false); continue; }
    dayTypes.push(d.type);
    let intenseToday = false;
    d.blocks.forEach(b => {
      const ex = exById(b.exerciseId);
      const lvl = (ex && ex.intensity) || "moderate";
      intensityCounts[lvl] = (intensityCounts[lvl] || 0) + 1;
      if (lvl === "intense") intenseToday = true;
      if (d.type === "strength") { strengthIntensitySum += intensityWeight(lvl); strengthIntensityBlocks++; }
    });
    dayHasIntense.push(intenseToday);
    if (d.type === "strength") { strengthDays++; d.blocks.forEach(b => { if (b.sets) totalSets += b.sets; }); }
    if (d.type === "cardio") { cardioDays++; d.blocks.forEach(b => { if (b.durationSec) totalCardioMin += b.durationSec / 60; }); }
  }
  const restDays = dayTypes.filter(t => t === "rest").length;
  const avgStrengthIntensity = strengthIntensityBlocks ? strengthIntensitySum / strengthIntensityBlocks : 0;

  let maxConsecStrength = 0, run = 0;
  let maxIntenseStreak = 0, intenseRun = 0;
  for (let i = 0; i < 14; i++) {
    if (dayTypes[i % 7] === "strength") { run++; maxConsecStrength = Math.max(maxConsecStrength, run); }
    else run = 0;
    if (dayHasIntense[i % 7]) { intenseRun++; maxIntenseStreak = Math.max(maxIntenseStreak, intenseRun); }
    else intenseRun = 0;
  }

  const suggestions = [];

  const warning = incompatibleGoalWarning(goals);
  if (warning) suggestions.push({ type:"warning", text: warning });

  goals.forEach(goal => {
    suggestions.push(...goalSuggestions(goal, { strengthDays, cardioDays, totalCardioMin, avgStrengthIntensity, intensityCounts }));
  });

  if (maxConsecStrength >= 3) suggestions.push({ type:"recovery", text:"Your plan has "+maxConsecStrength+" strength days in a row at least once this week. Muscles generally recover better with a rest day or light cardio between strength sessions." });
  if (restDays === 0) suggestions.push({ type:"recovery", text:"Every day currently has something scheduled. Even one true rest day a week helps recovery and lowers injury risk." });
  if (maxIntenseStreak >= 3) suggestions.push({ type:"intensity", text:"You have "+maxIntenseStreak+" Intense-level days in a row at least once this week. Back-to-back high-intensity sessions raise injury and burnout risk — consider spacing them with a Light or Moderate day, or a rest day." });

  if (age) {
    if (age >= 50) suggestions.push({ type:"age", text:"For your age group, low-impact cardio (brisk walking, cycling) and a longer warm-up before strength work are generally easier on joints." });
    if (age < 18) suggestions.push({ type:"age", text:"This plan is written for general adult use — if you're under 18, it's a good idea to have a parent, coach, or trainer review it with you." });
  }

  let bmiNote = null;
  if (bmi) {
    const cat = bmiCategory(bmi);
    if (cat === "Underweight") bmiNote = "Your BMI falls in the underweight range. If weight gain isn't your goal, that's worth mentioning to a doctor — BMI alone doesn't capture muscle mass or overall health.";
    else if (cat === "Overweight" || cat === "Obesity range") bmiNote = "Your BMI falls in the "+cat.toLowerCase()+". Starting with lower-impact cardio (walking, cycling) and building up gradually is a common, joint-friendly approach.";
    else bmiNote = "Your BMI falls in the typical range, though BMI is a rough screening number — it doesn't account for muscle mass, body composition, or individual health.";
  }

  return { bmi, bmiCat: bmi ? bmiCategory(bmi) : null, bmiNote, strengthDays, cardioDays, restDays, totalSets, totalCardioMin, intensityCounts, suggestions, goals };
}

function goalSuggestions(goal, ctx) {
  const { strengthDays, cardioDays, totalCardioMin, avgStrengthIntensity } = ctx;
  const out = [];
  if (goal === "build-muscle") {
    if (strengthDays < 3) out.push({ type:"goal", text:"Your goal is building muscle, but only "+strengthDays+" strength day(s) are scheduled. Three to four strength sessions a week generally gives muscle more stimulus to grow." });
    else out.push({ type:"goal", text:"Your strength frequency ("+strengthDays+" days/week) is solid for building muscle." });
    out.push({ type:"tip", text:"For hypertrophy, most sets in the 8–12 rep range (which your plan already uses) work well. Add weight or reps gradually as sets get easier — that progressive overload is what actually drives growth." });
    if (strengthDays > 0 && avgStrengthIntensity > 0 && avgStrengthIntensity < 1.7) out.push({ type:"intensity", text:"Most of your scheduled strength exercises are marked Light intensity. For building muscle, working some of them up to Moderate or Intense (heavier resistance, closer to muscular fatigue) tends to drive better results." });
  } else if (goal === "lose-weight") {
    if (cardioDays < 3) out.push({ type:"goal", text:"Your goal is losing weight, but only "+cardioDays+" cardio day(s) are scheduled. Consider adding a session or extending duration to raise weekly activity." });
    else out.push({ type:"goal", text:"Your cardio frequency ("+cardioDays+" days/week) supports a weight-loss goal." });
    if (strengthDays < 2) out.push({ type:"tip", text:"Keep at least 2 strength sessions a week even while focused on weight loss — it helps preserve muscle while you're in a calorie deficit." });
    out.push({ type:"tip", text:"Weight loss ultimately comes down to a sustained calorie deficit over time — training is one piece of that, alongside nutrition and daily activity." });
  } else if (goal === "endurance") {
    if (totalCardioMin < 90) out.push({ type:"goal", text:"For an endurance goal, weekly cardio is currently around "+Math.round(totalCardioMin)+" minutes. Building toward 150+ minutes a week is a common general-fitness benchmark." });
    else out.push({ type:"goal", text:"Weekly cardio volume (~"+Math.round(totalCardioMin)+" min) is in a solid range for endurance work." });
    out.push({ type:"tip", text:"Vary intensity — mix easy-paced sessions with one shorter, faster session each week to build both aerobic base and speed." });
  } else if (goal === "strength") {
    out.push({ type:"tip", text:"For a pure strength focus, lower rep ranges (roughly 4–6) with heavier resistance and longer rest (2–3 min) between sets tend to build strength faster than the 10–12 rep range currently in your plan." });
    if (strengthDays < 3) out.push({ type:"goal", text:"Consider 3 or more strength days a week, prioritizing your main lifts." });
    if (strengthDays > 0 && avgStrengthIntensity > 0 && avgStrengthIntensity < 2) out.push({ type:"intensity", text:"Your strength exercises currently skew Light-to-Moderate. Pure strength gains generally respond best to Intense-level effort on your main lifts, with full rest between sets." });
  } else {
    if (strengthDays >= 2 && cardioDays >= 2) out.push({ type:"goal", text:"Your plan already balances strength ("+strengthDays+" days) and cardio ("+cardioDays+" days), which fits a general fitness goal well." });
    else out.push({ type:"goal", text:"For general fitness, aim for a mix of both strength and cardio most weeks." });
  }
  return out;
}

function renderDayTag(type, isRest) {

function renderBlockRow(block, exercise, done, locked) {
  const name = exercise ? esc(exercise.name) : "Unknown exercise";
  const meta = block.durationSec
    ? fmtDuration(block.durationSec)
    : (block.sets+" × "+block.repsMin+(block.repsMax && block.repsMax !== block.repsMin ? "-"+block.repsMax : "")+" reps");
  // Instructions/video are expanded by default; collapsing one is a
  // per-block override remembered in state.openInfo.

  let html = '<div class="block-row '+(done?"done":"")+'" data-block-id="'+block.id+'">';
  html += '  <div class="block-row-main">';

    html += '    <span class="check-btn locked" aria-hidden="true" style="opacity:0.5;">'+(done?icon("check",16):icon("lock",13))+'</span>';
    html += '    <button class="block-btn" data-action="toggle-info" data-info-id="'+block.id+'">';

    html += '    <button class="check-btn '+(done?"done stamp-anim":"")+'" data-action="toggle-done" data-block-id="'+block.id+'">'+(done?icon("check",16):"")+'</button>';
    html += '    <button class="block-btn" data-action="toggle-done" data-block-id="'+block.id+'">';
  }
  html += '      <div class="block-name">'+name+'</div>';
  html += '      <div class="block-meta">'+meta+(block.note ? ' <span class="note">· '+esc(block.note)+'</span>' : '')+'</div>';
  html += '    </button>';
  if (canExpand) {
    html += '    <button class="info-btn '+(open?"open":"")+'" data-action="toggle-info" data-info-id="'+block.id+'">'+icon("info",16)+'</button>';
  }
  html += '  </div>';
  if (canExpand && open) {
    html += '  <div class="block-detail">';
    if (exercise.instructions) html += '<p>'+esc(exercise.instructions)+'</p>';
    html += '<a class="yt-link" href="'+youtubeSearchUrl(exercise.name)+'" target="_blank" rel="noopener noreferrer">'+icon("youtube",14)+' Watch "'+esc(exercise.name)+'" on YouTube</a>';

  }
  html += '</div>';
  return html;

/* ------------------------------------------------------------------ */
function dayCompletion(viewMonth, d) {
  if (!d) return null;
  const date = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d);
  const k = dateKey(date);
  const dow = date.getDay();
  const dayRoutine = state.routine[dow];
  const doneIds = (state.progress[k] && state.progress[k].doneBlockIds) || [];
  const isRest = !!(dayRoutine && dayRoutine.isRest);
  if (!dayRoutine || dayRoutine.blocks.length === 0) return { type: dayRoutine ? dayRoutine.type : null, ratio: 0, isRest, hasBlocks: false };
  const ratio = doneIds.filter(id => dayRoutine.blocks.some(b => b.id === id)).length / dayRoutine.blocks.length;
  return { type: dayRoutine.type, ratio, isRest, hasBlocks: true };
}

function renderCalendar() {
  const vm = state.viewMonth;
  const firstDow = new Date(vm.getFullYear(), vm.getMonth(), 1).getDay();
  const daysInMonth = new Date(vm.getFullYear(), vm.getMonth()+1, 0).getDate();
  const cells = [];
  for (let i=0;i<firstDow;i++) cells.push(null);
  for (let d=1; d<=daysInMonth; d++) cells.push(d);

  const selDKey = dateKey(state.selectedDate);
  const selDow = state.selectedDate.getDay();
  const selDay = state.routine[selDow];
  const selDone = (state.progress[selDKey] && state.progress[selDKey].doneBlockIds) || [];

  let html = '<div class="card" style="margin-bottom:20px;">';
  html += '<div class="cal-head">';
  html += '<button class="cal-nav-btn" data-action="cal-nav" data-dir="-1">'+icon("chevronLeft",18)+'</button>';
  html += '<div class="cal-month font-display">'+vm.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</div>';
  html += '<button class="cal-nav-btn" data-action="cal-nav" data-dir="1">'+icon("chevronRight",18)+'</button>';
  html += '</div>';
  html += '<div class="cal-dow-row font-mono">'+DAY_SHORT.map(d=>'<div>'+d[0]+'</div>').join('')+'</div>';
  html += '<div class="cal-grid" style="margin-top:4px;">';
  cells.forEach(d => {
    if (!d) { html += '<div></div>'; return; }
    const date = new Date(vm.getFullYear(), vm.getMonth(), d);
    const isSelected = dateKey(date) === selDKey;
    const isToday = dateKey(date) === todayKey();
    const comp = dayCompletion(vm, d);
    let dotHtml;
    if (comp && comp.isRest) {
      dotHtml = '<span class="cal-dot rest-mark" style="background:var(--chalk-dim);"></span>';
    } else if (comp && comp.hasBlocks) {
      const color = comp.type === "cardio" ? "var(--cyan)" : "var(--ember)";
      if (comp.ratio === 1) dotHtml = '<span class="cal-dot" style="background:'+color+';opacity:1;"></span>';
      else if (comp.ratio > 0) dotHtml = '<span class="cal-dot" style="background:'+color+';opacity:0.5;"></span>';
      else dotHtml = '<span class="cal-dot outline" style="border-color:'+color+';"></span>';
    } else {
      dotHtml = '<span class="cal-dot" style="background:transparent;"></span>';
    }
    html += '<button class="cal-day '+(isSelected?"selected":"")+' '+(isToday?"today":"")+'" data-action="cal-select" data-day="'+d+'">'+d+dotHtml+'</button>';
  });
  html += '</div></div>';

  const selLocked = !isEditableDate(state.selectedDate);

  html += '<div class="section-label font-mono">'+state.selectedDate.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+'</div>';
  html += '<div style="display:flex;align-items:center;gap:8px;margin:4px 0 14px;">';
  html += '<h3 class="font-display" style="margin:0;font-size:20px;text-transform:uppercase;letter-spacing:0.03em;">'+esc(selDay.label)+'</h3>';
  html += renderDayTag(selDay.type, selDay.isRest);
  html += '</div>';
  if (selLocked && selDay.blocks.length > 0) {
    html += '<div class="foot-note" style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px;">'+icon("lock",13)+'<p style="margin:0;">'+(isPastDate(state.selectedDate)?"Past days are locked — workouts can only be checked off on the day they happen.":"Future days are locked — you can preview them, but can\'t check them off early.")+'</p></div>';
  }
  if (selDay.isRest) {
    html += '<div class="empty-note">'+icon("moon",14)+' Rest day — recovery is part of the plan.</div>';
  } else if (selDay.blocks.length === 0) {
    html += '<div class="empty-note">Nothing scheduled — add exercises in Routine, or mark this a rest day.</div>';
  } else {
    selDay.blocks.forEach(b => { html += renderBlockRow(b, exById(b.exerciseId), selDone.includes(b.id), selLocked); });
  }
  return html;
}

function todaysSessionBlocks() {
  return state.routine[new Date().getDay()].blocks;
}
function markSessionBlockDone(block) {
  const dKey = todayKey();
  const cur = (state.progress[dKey] && state.progress[dKey].doneBlockIds) || [];
  if (!cur.includes(block.id)) {
    state.progress[dKey] = { doneBlockIds: [...cur, block.id] };
    saveData();
  }
}
function isSessionBlockComplete(block) {
  if (block.durationSec !== undefined) {
    const dKey = todayKey();
    const doneIds = (state.progress[dKey] && state.progress[dKey].doneBlockIds) || [];
    return doneIds.includes(block.id);
  }
  return (state.sessionSets[block.id] || 0) >= (block.sets || 1);
}
// Called right after a set is logged or an exercise is completed, to decide
// where the session goes next. "Rotate" cycles to the next exercise that
// still has work left (wrapping around, circuit-style); the default
// advances one exercise forward in order, same as a plain Next tap.
function sessionAdvance(blocks) {
  if (state.sessionRotate) {
    for (let step = 1; step <= blocks.length; step++) {
      const idx = (state.sessionIndex + step) % blocks.length;
      if (!isSessionBlockComplete(blocks[idx])) { state.sessionIndex = idx; return; }
    }
    state.sessionIndex = blocks.length; // nothing left — session complete
  } else {
    state.sessionIndex = Math.min(state.sessionIndex + 1, blocks.length);
  }
}
let sessionTimerInterval = null;
function stopSessionTimer() {
  if (sessionTimerInterval) { clearInterval(sessionTimerInterval); sessionTimerInterval = null; }
  if (state.sessionTimer) state.sessionTimer.running = false;
}
function startSessionTimer(block) {
  stopSessionTimer();
  if (!state.sessionTimer || state.sessionTimer.blockId !== block.id) {
    state.sessionTimer = { blockId: block.id, remaining: block.durationSec, total: block.durationSec, running: false };
  }
  if (state.sessionTimer.remaining <= 0) state.sessionTimer.remaining = state.sessionTimer.total;
  state.sessionTimer.running = true;
  sessionTimerInterval = setInterval(() => {
    if (!state.sessionTimer) { stopSessionTimer(); return; }
    state.sessionTimer.remaining -= 1;
    const timeEl = document.getElementById("session-timer-remaining");
    if (timeEl) timeEl.textContent = fmtClock(state.sessionTimer.remaining);
    const fillEl = document.getElementById("session-timer-fill");
    if (fillEl) fillEl.style.width = Math.max(0, (state.sessionTimer.remaining / state.sessionTimer.total) * 100) + "%";
    if (state.sessionTimer.remaining <= 0) {
      stopSessionTimer();
      if (!state.clockWarning) {
        const blocks = todaysSessionBlocks();
        markSessionBlockDone(blocks[state.sessionIndex]);
        sessionAdvance(blocks);
      }
      render();
    }
  }, 1000);
}
function renderSessionModal() {
  const blocks = todaysSessionBlocks();
  const dKey = todayKey();
  const doneIds = (state.progress[dKey] && state.progress[dKey].doneBlockIds) || [];

  let html = '<div class="modal-overlay" data-action="close-session" style="align-items:stretch;">';
  html += '<div class="modal" style="max-width:none;max-height:none;height:100%;border-radius:0;">';
  html += '<div class="modal-head"><span class="font-display">Session</span><span class="day-tag '+(state.sessionRotate?"cardio":"strength")+'" style="margin-left:8px;">'+(state.sessionRotate?"Rotating":"Sequential")+'</span><button data-action="close-session" style="margin-left:auto;">'+icon("x",18)+'</button></div>';

  if (blocks.length === 0) {
    html += '<div class="modal-list"><div class="empty-note">Nothing scheduled today.</div></div></div></div>';
    return html;
  }

  if (state.sessionIndex >= blocks.length) {
    html += '<div class="modal-list" style="text-align:center;padding-top:15vh;">';
    html += '<div style="color:var(--ember);display:flex;justify-content:center;margin-bottom:16px;">'+icon("flame",48)+'</div>';
    html += '<div class="font-display" style="font-size:22px;margin-bottom:8px;text-transform:uppercase;">Session complete</div>';
    html += '<div class="settings-desc" style="max-width:none;margin-bottom:24px;">Nice work — logged today\'s workout.</div>';
    html += '<button class="btn-primary" style="width:100%;" data-action="close-session">Done</button>';
    html += '</div></div></div>';
    return html;
  }

  const block = blocks[state.sessionIndex];
  const ex = exById(block.exerciseId);
  const isDuration = block.durationSec !== undefined;

  html += '<div class="modal-list">';
  html += '<div class="settings-desc" style="max-width:none;margin-bottom:6px;">Exercise '+(state.sessionIndex+1)+' of '+blocks.length+'</div>';
  html += '<div style="height:6px;border-radius:3px;background:var(--bg800);overflow:hidden;margin-bottom:22px;"><div style="height:100%;width:'+Math.round((state.sessionIndex/blocks.length)*100)+'%;background:var(--ember);"></div></div>';

  html += '<h2 class="font-display" style="font-size:28px;margin:0 0 6px;text-transform:uppercase;line-height:1.1;">'+(ex?esc(ex.name):"Unknown exercise")+'</h2>';
  if (ex) html += '<div class="settings-desc" style="max-width:none;margin-bottom:18px;">'+esc(ex.muscle)+' · '+esc(ex.equipment)+' · '+intensityLabel(ex.intensity)+'</div>';

  if (isDuration) {
    const timer = (state.sessionTimer && state.sessionTimer.blockId === block.id) ? state.sessionTimer : { remaining: block.durationSec, total: block.durationSec, running: false };
    html += '<div class="card" style="text-align:center;padding:32px 14px;margin-bottom:16px;">';
    html += '<div id="session-timer-remaining" class="font-display" style="font-size:52px;margin-bottom:16px;">'+fmtClock(timer.remaining)+'</div>';
    html += '<div style="height:8px;border-radius:4px;background:var(--bg800);overflow:hidden;margin-bottom:18px;"><div id="session-timer-fill" style="height:100%;width:'+Math.max(0,(timer.remaining/timer.total)*100)+'%;background:var(--ember);"></div></div>';
    html += '<div class="form-row-2">';
    if (timer.running) html += '<button class="btn-outline" style="flex:1;" data-action="session-timer-pause">'+icon("pause",14)+' Pause</button>';
    else html += '<button class="btn-primary" style="flex:1;" data-action="session-timer-start">'+icon("play",14)+' '+(timer.remaining < timer.total ? "Resume" : "Start")+'</button>';
    html += '<button class="btn-outline" style="flex:1;" data-action="session-timer-reset">'+icon("rotate",14)+' Reset</button>';
    html += '</div></div>';
  } else {
    const logged = state.sessionSets[block.id] || 0;
    const target = block.sets || 1;
    html += '<div class="card" style="text-align:center;padding:28px 14px;margin-bottom:16px;">';
    html += '<div class="font-display" style="font-size:20px;margin-bottom:4px;">'+target+' × '+block.repsMin+(block.repsMax && block.repsMax!==block.repsMin?"-"+block.repsMax:"")+' reps</div>';
    html += '<div class="settings-desc" style="max-width:none;margin-bottom:18px;">'+logged+' of '+target+' sets logged</div>';
    if (logged < target) html += '<button class="btn-primary" style="width:100%;" data-action="session-log-set">'+icon("check",14)+' Log Set</button>';
    else html += '<button class="btn-outline" style="width:100%;" disabled>'+icon("check",14)+' All sets logged</button>';
    html += '</div>';
  }
  if (block.note) html += '<div class="foot-note">'+icon("info",13)+'<p>'+esc(block.note)+'</p></div>';

  // Button layout, bottom to top of intent:
  //  - "Mark exercise complete" is a deliberate shortcut that finishes this
  //    exercise outright (skips logging sets / running the timer out) and
  //    moves on automatically — kept on its own row since it's a distinct
  //    action from browsing.
  //  - Previous / Next are pure navigation between exercises. Next is
  //    labeled "Skip" whenever the current exercise isn't actually done yet,
  //    so it's clear that moving on will NOT mark it complete.
  const blockDone = isSessionBlockComplete(block);
  const isLast = state.sessionIndex === blocks.length - 1;
  let nextLabel;
  if (isLast) nextLabel = blockDone ? "Finish" : "Skip & finish";
  else nextLabel = blockDone ? "Next exercise" : "Skip exercise";

  html += '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);">';
  html += '<button class="btn-outline" style="width:100%;" data-action="session-mark-done">'+icon("check",14)+' Mark exercise complete</button>';
  html += '<div class="settings-desc" style="max-width:none;text-align:center;margin-top:6px;">Finishes this exercise without logging '+(isDuration?"the timer":"each set")+' — moves on to the next one automatically.</div>';
  html += '</div>';

  html += '<div class="form-row-2" style="margin-top:14px;">';
  html += '<button class="btn-outline" '+(state.sessionIndex===0?"disabled":"")+' data-action="session-prev">'+icon("chevronLeft",14)+' Previous</button>';
  html += '<button class="btn-primary" data-action="session-next">'+nextLabel+' '+icon("chevronRight",14)+'</button>';
  html += '</div>';

  if (ex) {
    html += '<div class="block-detail" style="border-top:1px solid var(--line);padding:14px 0 0;margin-top:16px;">';
    if (ex.instructions) html += '<p>'+esc(ex.instructions)+'</p>';
    html += '<a class="yt-link" href="'+youtubeSearchUrl(ex.name)+'" target="_blank" rel="noopener noreferrer">'+icon("youtube",14)+' Watch "'+esc(ex.name)+'" on YouTube</a>';
    html += '</div>';
  }

  html += '</div></div></div>';
  return html;
}

function renderSettings() {
  return state.settingsSection ? renderSettingsSection(state.settingsSection) : renderSettingsMenu();

function renderSettingsMenu() {
  let html = '<div class="settings-search">'+icon("search",15)+'<input id="settings-search" placeholder="Search settings" value="'+esc(state.settingsSearch)+'" /></div>';
  html += '<div id="settings-menu-list">' + renderSettingsMenuList() + '</div>';
  return html;
}

function renderSettingsMenuList() {
  const q = state.settingsSearch.trim().toLowerCase();
  const sections = q
    ? SETTINGS_SECTIONS.filter(s => s.label.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q))
    : SETTINGS_SECTIONS;
  if (sections.length === 0) {
    return '<div class="settings-menu-empty">No settings match "'+esc(state.settingsSearch)+'"</div>';
  }
  let html = '<div class="settings-menu-list">';
  sections.forEach(s => {
    html += '<button class="settings-menu-row" data-action="open-settings-section" data-section="'+s.id+'">';
    html += '<span class="settings-menu-icon" style="background:'+s.color+';">'+icon(s.icon,18)+'</span>';

    html += '<div class="settings-menu-label">'+s.label+'</div>';
    html += '<div class="settings-menu-desc">'+s.desc+'</div>';
    html += '</span>';
    html += '<span class="settings-menu-chevron">'+icon("chevronRight",18)+'</span>';
    html += '</button>';
  });
  html += '</div>';
  return html;
}

      html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);">';
      html += '<div class="settings-desc" style="max-width:none;margin-bottom:10px;">Import <strong style="color:var(--chalk);">'+esc(state.pendingImport.fileName)+'</strong>? This replaces all current data on this device.</div>';
      html += '<div class="form-row-2">';
      html += '<button class="btn-outline" data-action="cancel-import">Cancel</button>';
      html += '<button class="btn-primary" data-action="confirm-import">Import &amp; Replace</button>';
      html += '</div></div>';
    }
    html += '</div>';

  } else if (id === "danger") {
    html += settingsSectionHeader("Danger Zone");
    html += '<div class="card" style="border-color:var(--ember);">';
    html += settingsAction("reset-app", "Reset entire app", "Erases everything on this device — routine, library, equipment list, progress, profile, and appearance — and takes you back through setup from scratch. This can't be undone.");
    html += '</div>';

  } else if (id === "about") {
    html += settingsSectionHeader("About");
    html += '<div class="card">';
    html += '<div class="about-row"><div class="brand-icon" style="width:28px;height:28px;">'+icon("dumbbell",14)+'</div>';
    html += '<div><div class="font-display" style="text-transform:uppercase;letter-spacing:0.04em;font-size:14px;">RST <span class="font-mono" style="color:var(--chalk-dim);font-size:10px;letter-spacing:0.08em;">• READY SET TRAIN</span></div>';
    html += '<div class="settings-desc" style="max-width:none;">Your routine, calendar, and progress are saved automatically in this browser (localStorage).</div></div></div>';
    html += '</div>';
  }

  return html;
}
function settingsAction(id, title, desc) {
  const confirming = state.confirmingAction === id;
  const label = confirming ? "Tap again to confirm" : (id==="clear-progress"?"Clear":(id==="reset-app"?"Erase everything":"Reset"));
  const danger = id === "reset-app";
  return (
    '<div class="settings-item-row">'+
    '<div><div class="settings-title">'+title+'</div><div class="settings-desc">'+desc+'</div></div>'+
    '<button class="action-btn" style="'+(danger?"border-color:var(--ember);color:var(--ember);":"")+'" data-action="settings-do" data-do="'+id+'">'+icon(danger?"alert":"rotate",12)+' '+label+'</button>'+
    '</div>'
  );
}

      body += '<p style="margin:0;font-size:13px;line-height:1.55;color:'+(isWarning?"var(--ember-tag)":"var(--chalk)")+';">'+s.text+'</p>';

    '<div class="modal-list" style="padding-top:2px;">'+body+'</div>'+
    '</div></div>'
  );
}
function statTile(value, label) {
  return '<div><div class="font-display" style="font-size:22px;color:var(--chalk);">'+value+'</div><div class="font-mono" style="font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:var(--chalk-dim);margin-top:2px;">'+label+'</div></div>';

function suggestionIcon(type) {
  if (type === "recovery") return "clock";
  if (type === "age") return "info";
  if (type === "warning") return "alert";
  if (type === "intensity") return "zap";

/* ------------------------------------------------------------------ */
/* Master render                                                        */
/* ------------------------------------------------------------------ */
function render() {
  applyTheme();
  const app = document.getElementById("app");

  if (!state.onboardingDone) {
    app.innerHTML = renderOnboarding();
    attachLiveInputs();
    return;
  }

  let mainHtml = "";
  if (state.tab === "today") mainHtml = renderToday();
  else if (state.tab === "calendar") mainHtml = renderCalendar();
  else if (state.tab === "builder") mainHtml = renderBuilder();
  else if (state.tab === "library") mainHtml = renderLibrary();
  else if (state.tab === "settings") mainHtml = renderSettings();

  app.innerHTML = renderHeader() + '<main>' + mainHtml + '</main>' + renderTabBar() +
    (state.showCheckModal ? renderCheckModal() : "") +
    (state.showSuggestedModal ? renderSuggestedModal() : "") +
    (state.showAddExercise ? renderAddExerciseModal() : "") +
    (state.showEditExercise ? renderEditExerciseModal() : "") +
    (state.sessionActive ? renderSessionModal() : "") +
    (state.showBadgeModal ? renderBadgeModal() : "");
  attachLiveInputs();
}

function attachLiveInputs() {
  // Library search (partial re-render of list only, keeps focus)
  const libSearch = document.getElementById("lib-search");
  if (libSearch) {
    libSearch.addEventListener("input", (e) => {
      state.librarySearch = e.target.value;
      document.getElementById("lib-list").innerHTML = renderLibraryList();
    });
  }
  // Settings search (partial re-render of the category list, keeps focus)
  const settingsSearch = document.getElementById("settings-search");
  if (settingsSearch) {
    settingsSearch.addEventListener("input", (e) => {
      state.settingsSearch = e.target.value;
      document.getElementById("settings-menu-list").innerHTML = renderSettingsMenuList();
    });
  }
  // Picker search
  const pickerSearch = document.getElementById("picker-search");
  if (pickerSearch) {
    pickerSearch.focus();
    pickerSearch.setSelectionRange(pickerSearch.value.length, pickerSearch.value.length);
    pickerSearch.addEventListener("input", (e) => {
      state.pickerQuery = e.target.value;
      const q = state.pickerQuery.toLowerCase();
      const ef = pickerEquipmentFilter();
      const filtered = state.library.filter(ex => !ex.hidden && (ex.name.toLowerCase().includes(q) || (ex.muscle && ex.muscle.toLowerCase().includes(q))) && (!ef.active || ef.owned.includes(ex.equipment)));
      document.getElementById("picker-list").innerHTML = renderPickerList(filtered);
    });
  }
  // Add-exercise form fields (state-only, no re-render needed until submit)
  ["add-ex-name","add-ex-muscle","add-ex-instructions"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", (e) => {
      const key = id.replace("add-ex-","");
      state.addForm[key] = e.target.value;
    });
  });
  const eqSel = document.getElementById("add-ex-equipment");
  if (eqSel) eqSel.addEventListener("change", e => state.addForm.equipment = e.target.value);
  const catSel = document.getElementById("add-ex-category");
  if (catSel) catSel.addEventListener("change", e => state.addForm.category = e.target.value);
  const intSel = document.getElementById("add-ex-intensity");
  if (intSel) intSel.addEventListener("change", e => state.addForm.intensity = e.target.value);

  bindEditExerciseForm();
  renderBadgePreview();
  const dayLabelInput = document.querySelector('[data-action="edit-day-label"]');
  if (dayLabelInput) dayLabelInput.addEventListener("input", (e) => {
    state.routine[state.builderDay].label = e.target.value;
  });

  // Builder block fields: sets/reps/duration/note (state-only, no re-render)
  document.querySelectorAll('[data-action="edit-field"]').forEach(el => {
    el.addEventListener("input", (e) => {
      const blockId = el.dataset.blockId, field = el.dataset.field;
      const block = findBlock(blockId);
      if (block) block[field] = Number(e.target.value) || 0;
    });
  });
  document.querySelectorAll('[data-action="edit-duration"]').forEach(el => {
    el.addEventListener("input", (e) => {
      const block = findBlock(el.dataset.blockId);
      if (block) block.durationSec = Math.max(1, Number(e.target.value) || 1) * 60;
    });
  });
  document.querySelectorAll('[data-action="edit-duration-sec"]').forEach(el => {
    el.addEventListener("input", (e) => {
      const block = findBlock(el.dataset.blockId);
      if (block) block.durationSec = Math.max(5, Number(e.target.value) || 5);
    });
  });
  document.querySelectorAll('[data-action="edit-note"]').forEach(el => {
    el.addEventListener("input", (e) => {
      const block = findBlock(el.dataset.blockId);
      if (block) block.note = e.target.value;
    });
  });

  // Profile fields (Settings) — live-update + autosave, no re-render needed
  bindProfileField("prof-gender", "gender", true);
  bindProfileField("prof-age", "age");
  bindProfileField("prof-height-ft", "heightFt");
  bindProfileField("prof-height-in", "heightIn");
  bindProfileField("prof-weight", "weightLbs");

  // Onboarding fields — held in state.profile directly, saved on submit
  bindProfileField("ob-gender", "gender", true);
  bindProfileField("ob-age", "age");
  bindProfileField("ob-height-ft", "heightFt");
  bindProfileField("ob-height-in", "heightIn");
  bindProfileField("ob-weight", "weightLbs");

  // Backup import file picker
  const importInput = document.getElementById("import-file-input");
  if (importInput) {
    importInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) handleImportFile(file);
      e.target.value = ""; // allow re-selecting the same file later
    });
  }
}

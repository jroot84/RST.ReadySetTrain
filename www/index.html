function drawBadgeCanvas() {
  const canvas = document.getElementById("badge-canvas");
  if (!canvas) return null;
  const ctx = canvas.getContext("2d");
  if (!ctx) return null;
  const cs = getComputedStyle(document.documentElement);
  const ember = cs.getPropertyValue("--ember").trim() || "#E8622C";
  const bg950 = cs.getPropertyValue("--bg950").trim() || "#14181C";
  const bg900 = cs.getPropertyValue("--bg900").trim() || "#1B2126";
  const chalk = cs.getPropertyValue("--chalk").trim() || "#ECE8E1";
  const chalkDim = cs.getPropertyValue("--chalk-dim").trim() || "#8F99A1";
  const stats = getStreakStats();
  const W = canvas.width, H = canvas.height;

  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, bg900);
  grad.addColorStop(1, bg950);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = chalk;
  ctx.font = "700 34px Oswald, sans-serif";
  ctx.fillText("RST", W / 2, 90);
  ctx.font = "600 14px 'JetBrains Mono', monospace";
  ctx.fillStyle = chalkDim;
  ctx.fillText("READY SET TRAIN", W / 2, 116);

  ctx.fillStyle = ember;
  ctx.font = "700 150px Oswald, sans-serif";
  ctx.fillText(String(stats.current), W / 2, 330);
  ctx.font = "600 20px 'JetBrains Mono', monospace";
  ctx.fillStyle = chalk;
  ctx.fillText((stats.current === 1 ? "DAY STREAK" : "DAY STREAK"), W / 2, 365);

  ctx.font = "700 30px Oswald, sans-serif";
  ctx.fillStyle = chalk;
  ctx.fillText(stats.rank.label.toUpperCase() + " RANK", W / 2, 440);

  ctx.font = "600 16px 'JetBrains Mono', monospace";
  ctx.fillStyle = chalkDim;
  ctx.fillText("Best streak: " + stats.best + "  ·  Total completed: " + stats.total, W / 2, 478);

  ctx.fillStyle = ember;
  ctx.fillRect(W / 2 - 90, 508, 180, 6);

  return canvas;
}
function renderBadgePreview() {
  if (!document.getElementById("badge-canvas")) return;
  const draw = () => {
    drawBadgeCanvas();
    const canvas = document.getElementById("badge-canvas");
    const preview = document.getElementById("badge-preview");
    if (canvas && preview) preview.innerHTML = '<img src="'+canvas.toDataURL("image/png")+'" style="width:100%;display:block;" alt="Achievement badge preview" />';
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw).catch(draw);
  else draw();
}

function bindProfileField(elId, profileKey, isSelect) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.addEventListener(isSelect ? "change" : "input", (e) => {
    state.profile[profileKey] = e.target.value;
    saveData();
  });
}

function findBlock(blockId) {
  const day = state.routine[state.builderDay];
  return day.blocks.find(b => b.id === blockId);
}

/* ------------------------------------------------------------------ */
/* Event delegation (click)                                             */
/* ------------------------------------------------------------------ */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const action = t.dataset.action;

  if (action === "set-tab") {
    const nextTab = t.dataset.tab;
    const hadModal = state.pickerOpen || state.showCheckModal;
    state.pickerOpen = false;
    state.showCheckModal = false;
    if (nextTab !== state.tab) {
      state.tab = nextTab;
      state.settingsSection = null;
      state.settingsSearch = "";
      pushHistory();
    } else if (hadModal) {
      pushHistory();
    }
    saveData(); render(); return;
  }
  if (action === "toggle-done") {
    // Anti-cheat: only today's date can ever be checked off, and only if
    // the device clock passes the tamper check. Recomputed fresh here (not
    // read from cached state) so this can't be tricked by a stale value.
    if (state.clockWarning) return;
    const targetDate = state.tab === "calendar" ? state.selectedDate : new Date();
    if (!isEditableDate(targetDate)) return;
    const dKey = todayKey();
    const cur = (state.progress[dKey] && state.progress[dKey].doneBlockIds) || [];
    const blockId = t.dataset.blockId;
    const next = cur.includes(blockId) ? cur.filter(b => b !== blockId) : [...cur, blockId];
    state.progress[dKey] = { doneBlockIds: next };
    saveData(); render(); return;
  }
  if (action === "toggle-info") {
    const id = t.dataset.infoId;
    state.openInfo[id] = !state.openInfo[id];
    render(); return;
  }
  if (action === "toggle-lib-info") {
    const key = "lib-" + t.dataset.exId;
    state.openInfo[key] = !state.openInfo[key];
    if (!state.openInfo[key] && state.editingExId === t.dataset.exId) {
      state.editingExId = null;
      state.editForm = null;
    }
    document.getElementById("lib-list").innerHTML = renderLibraryList();
    return;
  }
  if (action === "cal-nav") {
    const dir = Number(t.dataset.dir);
    state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth() + dir, 1);
    render(); return;
  }
  if (action === "cal-select") {
    const d = Number(t.dataset.day);
    state.selectedDate = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth(), d);
    render(); return;
  }
  if (action === "builder-day") {
    state.builderDay = Number(t.dataset.day);
    state.pickerOpen = false;
    state.confirmingAction = null;
    render(); return;
  }
  if (action === "set-day-type") {
    const day = state.routine[state.builderDay];
    const newType = t.dataset.type;
    if (newType === "rest") {
      if (day.blocks.length > 0 && state.confirmingAction !== "rest-day") {
        state.confirmingAction = "rest-day";
        render(); return;
      }
      day.blocks = [];
      day.isRest = true;
      state.confirmingAction = null;
    } else {
      day.type = newType;
      day.isRest = false;
      state.confirmingAction = null;
    }
    saveData(); render(); return;
  }
  if (action === "remove-block") {
    const day = state.routine[state.builderDay];
    day.blocks = day.blocks.filter(b => b.id !== t.dataset.blockId);
    saveData(); render(); return;
  }
  if (action === "move-block") {
    const day = state.routine[state.builderDay];
    const idx = day.blocks.findIndex(b => b.id === t.dataset.blockId);
    if (idx === -1) return;
    const dir = t.dataset.dir === "up" ? -1 : 1;
    const swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= day.blocks.length) return;
    const tmp = day.blocks[idx];
    day.blocks[idx] = day.blocks[swapIdx];
    day.blocks[swapIdx] = tmp;
    saveData(); render(); return;
  }
  if (action === "open-picker") {
    state.pickerOpen = true; state.pickerQuery = ""; state.pickerShowAllEquip = false;
    pushHistory();
    render(); return;
  }
  if (action === "close-picker") {
    // Backdrop click should only close if it landed directly on the overlay, not bubbled from inner content.
    // The X button also uses this action and should always close when clicked.
    if (t.classList.contains("modal-overlay") && e.target !== t) return;
    closeModalViaBack();
    return;
  }
  if (action === "picker-show-all-equip") {
    state.pickerShowAllEquip = true;
    render(); return;
  }
  if (action === "picker-show-owned-equip") {
    state.pickerShowAllEquip = false;
    render(); return;
  }
  if (action === "pick-exercise") {
    const ex = exById(t.dataset.exId);
    if (ex) {
      const day = state.routine[state.builderDay];
      day.isRest = false;
      if (ex.category === "cardio" || ex.timed) {
        const dur = TIMED_EXERCISE_DEFAULTS[ex.id] || (ex.category === "cardio" ? 900 : 30);
        day.blocks.push(cardioBlk(ex.id, dur));
      } else {
        day.blocks.push(blk(ex.id, 3, 10, 12));
      }
    }
    saveData();
    closeModalViaBack();
    return;
  }
  if (action === "lib-filter") {
    state.libraryEquip = t.dataset.equip;
    render(); return;
  }
  if (action === "open-manage-equipment") {
    state.showManageEquipment = true;
    pushHistory();
    render(); return;
  }
  if (action === "close-manage-equipment") {
    if (t.classList.contains("modal-overlay") && e.target !== t) return;
    closeModalViaBack();
    return;
  }
  if (action === "open-suggested-modal") {
    state.showSuggestedModal = true;
    state.confirmUseTemplateId = null;
    pushHistory();
    render(); return;
  }
  if (action === "close-suggested-modal") {
    if (t.classList.contains("modal-overlay") && e.target !== t) return;
    state.confirmUseTemplateId = null;
    closeModalViaBack();
    return;
  }
  if (action === "open-badge-modal") {
    state.showBadgeModal = true;
    pushHistory();
    render(); return;
  }
  if (action === "close-badge-modal") {
    if (t.classList.contains("modal-overlay") && e.target !== t) return;
    closeModalViaBack();
    return;
  }
  if (action === "download-badge") {
    const canvas = document.getElementById("badge-canvas");
    if (!canvas) return;
    canvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rst-badge-" + new Date().toISOString().slice(0, 10) + ".png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    return;
  }
  if (action === "share-badge") {
    const canvas = document.getElementById("badge-canvas");
    if (!canvas) return;
    const stats = getStreakStats();
    const shareText = "I'm on a "+stats.current+"-day streak on RST \u2022 Ready Set Train! Rank: "+stats.rank.label+". "+stats.total+" exercises completed so far.";
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      try {
        const file = new File([blob], "rst-badge.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: "RST Streak", text: shareText });
          return;
        }
        if (navigator.share) {
          await navigator.share({ title: "RST Streak", text: shareText });
          return;
        }
      } catch (err) {
        if (err && err.name === "AbortError") return; // user cancelled — do nothing
      }
      // No Web Share support on this browser — open a text message with the
      // summary pre-filled (the image itself can't attach via this fallback).
      window.location.href = "sms:&body=" + encodeURIComponent(shareText);
    });
    return;
  }
  if (action === "use-template") {
    const id = t.dataset.templateId;
    if (state.confirmUseTemplateId === id) {
      const tmpl = ROUTINE_TEMPLATES.find(x => x.id === id);
      if (tmpl) state.routine = tmpl.build();
      state.confirmUseTemplateId = null;
      state.showSuggestedModal = false;
      state.builderDay = new Date().getDay();
      state.tab = "builder";
      saveData();
      replaceHistory();
      render();
    } else {
      state.confirmUseTemplateId = id;
      render();
    }
    return;
  }
  if (action === "add-equipment") {
    const input = document.getElementById("new-equip-input");
    const val = input ? input.value.trim() : "";
    if (!val) return;
    const exists = state.equipment.some(eq => eq.toLowerCase() === val.toLowerCase());
    if (!exists) state.equipment.push(val);
    saveData(); render(); return;
  }
  if (action === "remove-equipment") {
    const eq = t.dataset.equip;
    if (state.equipment.length <= 1) return; // always keep at least one option
    state.equipment = state.equipment.filter(e => e !== eq);
    // Reassign any exercises using the removed equipment so nothing dangles.
    const fallback = state.equipment[0];
    state.library.forEach(ex => { if (ex.equipment === eq) ex.equipment = fallback; });
    if (state.libraryEquip === eq) state.libraryEquip = "All";
    if (state.addForm.equipment === eq) state.addForm.equipment = fallback;
    saveData(); render(); return;
  }
  if (action === "toggle-hide-exercise") {
    const ex = exById(t.dataset.exId);
    if (ex) ex.hidden = !ex.hidden;
    saveData();
    document.getElementById("lib-list").innerHTML = renderLibraryList();
    return;
  }
  if (action === "delete-exercise") {
    const id = t.dataset.exId;
    if (state.confirmDeleteExId === id) {
      state.library = state.library.filter(e => e.id !== id);
      state.confirmDeleteExId = null;
      saveData(); render(); return;
    } else {
      state.confirmDeleteExId = id;
      document.getElementById("lib-list").innerHTML = renderLibraryList();
      return;
    }
  }
  if (action === "toggle-goal") {
    const id = t.dataset.goalId;
    const goals = state.profile.goals;
    const i = goals.indexOf(id);
    if (i === -1) goals.push(id); else goals.splice(i, 1);
    saveData(); render(); return;
  }
  if (action === "toggle-owned-equipment") {
    const owned = ownedEquipmentOrDefault();
    const i = owned.indexOf(t.dataset.equip);
    if (i === -1) owned.push(t.dataset.equip); else owned.splice(i, 1);
    state.profile.availableEquipment = owned;
    saveData(); render(); return;
  }
  if (action === "owned-equipment-all") {
    state.profile.availableEquipment = state.equipment.slice();
    saveData(); render(); return;
  }
  if (action === "owned-equipment-none") {
    state.profile.availableEquipment = [];
    saveData(); render(); return;
  }
  if (action === "set-palette") {
    state.palette = t.dataset.palette;
    saveData(); render(); return;
  }
  if (action === "set-session-rotate") {
    state.sessionRotate = t.dataset.rotate === "1";
    saveData(); render(); return;
  }
  if (action === "open-add-exercise") {
    state.showAddExercise = true;
    pushHistory();
    render(); return;
  }
  if (action === "close-add-exercise") {
    if (t.classList.contains("modal-overlay") && e.target !== t) return;
    closeModalViaBack();
    return;
  }
  if (action === "save-add-exercise") {
    const f = state.addForm;
    if (!f.name.trim()) return;
    const id = f.name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-" + Math.random().toString(36).slice(2,6);
    state.library.push({ id, name: f.name.trim(), equipment: f.equipment, category: f.category, muscle: f.muscle || "Custom", instructions: f.instructions.trim(), intensity: f.intensity || "moderate", timed: !!f.timed, custom: true, hidden: false });
    state.addForm = { name:"", equipment:"Bodyweight", category:"strength", muscle:"", instructions:"", intensity:"moderate", timed:false };
    saveData();
    closeModalViaBack();
    return;
  }
  if (action === "toggle-add-timed") {
    state.addForm.timed = !state.addForm.timed;
    render(); return;
  }
  if (action === "toggle-edit-timed") {
    state.editForm.timed = !state.editForm.timed;
    render(); return;
  }
  if (action === "start-edit-exercise") {
    const ex = exById(t.dataset.exId);
    if (!ex) return;
    state.editingExId = ex.id;
    state.editForm = { name: ex.name, equipment: ex.equipment, category: ex.category, muscle: ex.muscle, instructions: ex.instructions || "", intensity: ex.intensity || "moderate", timed: !!ex.timed };
    state.showEditExercise = true;
    pushHistory();
    render(); return;
  }
  if (action === "cancel-edit-exercise") {
    if (t.classList.contains("modal-overlay") && e.target !== t) return;
    closeModalViaBack();
    return;
  }
  if (action === "save-edit-exercise") {
    const ex = exById(state.editingExId);
    const f = state.editForm;
    if (ex && f && f.name.trim()) {
      ex.name = f.name.trim();
      ex.equipment = f.equipment;
      ex.category = f.category;
      ex.muscle = f.muscle.trim() || "Custom";
      ex.instructions = f.instructions.trim();
      ex.intensity = f.intensity || "moderate";
      ex.timed = !!f.timed;
    }
    state.editingExId = null;
    state.editForm = null;
    saveData();
    closeModalViaBack();
    return;
  }
  if (action === "set-theme") {
    state.theme = t.dataset.theme;
    saveData(); render(); return;
  }
  if (action === "settings-do") {
    const doAction = t.dataset.do;
    if (state.confirmingAction === doAction) {
      if (doAction === "clear-progress") state.progress = {};
      if (doAction === "reset-routine") state.routine = seedRoutine();
      if (doAction === "reset-routine-blank") state.routine = blankRoutine();
      if (doAction === "reset-library") { state.library = SEED_LIBRARY.slice(); state.editingExId = null; state.editForm = null; state.showEditExercise = false; state.confirmDeleteExId = null; }
      if (doAction === "reset-app") {
        state.routine = blankRoutine();
        state.library = SEED_LIBRARY.slice();
        state.equipment = DEFAULT_EQUIPMENT.slice();
        state.progress = {};
        state.profile = { gender:"", age:"", heightFt:"", heightIn:"", weightLbs:"", goals:[], availableEquipment:null };
        state.theme = "dark";
        state.palette = "ember";
        state.tab = "today";
        state.libraryEquip = "All";
        state.showManageEquipment = false;
        state.showSuggestedModal = false;
        state.confirmUseTemplateId = null;
        state.confirmDeleteExId = null;
        state.editingExId = null;
        state.editForm = null;
        state.showEditExercise = false;
        state.onboardingDone = false;
        state.showCheckModal = false;
        state.pickerOpen = false;
        state.pendingImport = null;
        state.importError = "";
        state.bestStreak = 0;
        state.sessionRotate = false;
        state.showBadgeModal = false;
        state.sessionActive = false;
        state.sessionIndex = 0;
        state.sessionSets = {};
        state.sessionTimer = null;
        state.showAddExercise = false;
        state.pickerShowAllEquip = false;
        stopSessionTimer();
      }
      state.confirmingAction = null;
      saveData();
      if (doAction === "reset-app") { replaceHistory(); }
    } else {
      state.confirmingAction = doAction;
    }
    render(); return;
  }
  if (action === "export-backup") {
    exportBackup();
    return;
  }
  if (action === "trigger-import") {
    const input = document.getElementById("import-file-input");
    if (input) input.click();
    return;
  }
  if (action === "cancel-import") {
    state.pendingImport = null;
    state.importError = "";
    render(); return;
  }
  if (action === "confirm-import") {
    applyPendingImport();
    return;
  }
  if (action === "onboarding-save" || action === "onboarding-skip") {
    state.onboardingDone = true;
    if (routineIsEmpty()) state.tab = "builder";
    saveData(); replaceHistory(); render(); return;
  }
  if (action === "open-check-modal") {
    state.showCheckModal = true;
    pushHistory();
    render(); return;
  }
  if (action === "close-check-modal") {
    if (t.classList.contains("modal-overlay") && e.target !== t) return;
    closeModalViaBack();
    return;
  }
  if (action === "open-session") {
    if (state.clockWarning) return; // anti-cheat: clock tamper detected
    const blocks = todaysSessionBlocks();
    const dKey = todayKey();
    const doneIds = (state.progress[dKey] && state.progress[dKey].doneBlockIds) || [];
    const firstUndone = blocks.findIndex(b => !doneIds.includes(b.id));
    state.sessionIndex = firstUndone === -1 ? 0 : firstUndone;
    state.sessionSets = {};
    state.sessionTimer = null;
    state.sessionActive = true;
    pushHistory();
    render(); return;
  }
  if (action === "close-session") {
    if (t.classList.contains("modal-overlay") && e.target !== t) return;
    stopSessionTimer();
    closeModalViaBack();
    return;
  }
  if (action === "session-next") {
    stopSessionTimer();
    state.sessionIndex = Math.min(state.sessionIndex + 1, todaysSessionBlocks().length);
    render(); return;
  }
  if (action === "session-prev") {
    stopSessionTimer();
    state.sessionIndex = Math.max(state.sessionIndex - 1, 0);
    render(); return;
  }
  if (action === "session-mark-done") {
    if (state.clockWarning) return; // anti-cheat: clock tamper detected
    stopSessionTimer();
    const blocks = todaysSessionBlocks();
    const block = blocks[state.sessionIndex];
    if (block) {
      if (block.durationSec === undefined) state.sessionSets[block.id] = block.sets || 1;
      markSessionBlockDone(block);
    }
    sessionAdvance(blocks);
    render(); return;
  }
  if (action === "session-log-set") {
    if (state.clockWarning) return; // anti-cheat: clock tamper detected
    const blocks = todaysSessionBlocks();
    const block = blocks[state.sessionIndex];
    if (!block) return;
    const logged = (state.sessionSets[block.id] || 0) + 1;
    state.sessionSets[block.id] = logged;
    const justCompleted = logged >= (block.sets || 1);
    if (justCompleted) markSessionBlockDone(block);
    // Rotating mode cycles to the next exercise after every single set,
    // circuit-style, even if this one still has sets left. The default
    // mode only advances once the current exercise is fully done.
    if (state.sessionRotate || justCompleted) sessionAdvance(blocks);
    render(); return;
  }
  if (action === "session-timer-start") {
    const block = todaysSessionBlocks()[state.sessionIndex];
    if (block) startSessionTimer(block);
    render(); return;
  }
  if (action === "session-timer-pause") {
    stopSessionTimer();
    render(); return;
  }
  if (action === "session-timer-reset") {
    stopSessionTimer();
    const block = todaysSessionBlocks()[state.sessionIndex];
    if (block) state.sessionTimer = { blockId: block.id, remaining: block.durationSec, total: block.durationSec, running: false };
    render(); return;
  }
  if (action === "goto-profile") {
    state.showCheckModal = false;
    state.tab = "settings";
    state.settingsSection = "profile";
    pushHistory();
    render(); return;
  }
  if (action === "open-settings-section") {
    state.settingsSection = t.dataset.section;
    pushHistory();
    render(); return;
  }
  if (action === "close-settings-section") {
    if (history.state && history.state.settingsSection) {
      history.back();
    } else {
      state.settingsSection = null;
      render();
    }
    return;
  }
});

/* ------------------------------------------------------------------ */
/* Boot                                                                  */
/* ------------------------------------------------------------------ */
(function init() {
  const saved = loadData();
  if (saved) {
    if (saved.routine) state.routine = saved.routine;
    if (saved.library) state.library = saved.library;
    if (saved.equipment) state.equipment = saved.equipment;
    if (saved.progress) state.progress = saved.progress;
    if (saved.theme) state.theme = saved.theme;
    if (saved.palette) state.palette = saved.palette;
    if (saved.profile) state.profile = migrateProfile(saved.profile);
    if (saved.onboardingDone) state.onboardingDone = saved.onboardingDone;
    if (typeof saved.bestStreak === "number") state.bestStreak = saved.bestStreak;
    if (typeof saved.sessionRotate === "boolean") state.sessionRotate = saved.sessionRotate;
  }
  if (state.onboardingDone) replaceHistory();
  checkClockIntegrity();
  render();
  setInterval(() => {
    const was = state.clockWarning;
    checkClockIntegrity();
    if (was !== state.clockWarning) render();
  }, 60000);
})();
</script>
</body>
</html>
